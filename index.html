const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let dpr = 1, vw = 0, vh = 0, k = 1, ox = 0, oy = 0;
const bg = document.createElement('canvas');
const bgx = bg.getContext('2d');

const imgBody = new Image(); imgBody.src = IMG_BODY;
const imgHead = new Image(); imgHead.src = IMG_HEAD;

let ants = [];
const mouse = { x: -9999, y: -9999, down: false, inside: false };
const shocks = [];
let t = 0;

// ---------- 유틸 ----------
const rand = (a, b) => a + Math.random() * (b - a);
function angLerp(a, b, f) {
  let d = b - a;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return a + d * f;
}

// ---------- 글자 → 목표 좌표 ----------
function sampleText(word) {
  const off = document.createElement('canvas');
  off.width = PW; off.height = HEADER_H;
  const o = off.getContext('2d', { willReadFrequently: true });
  o.fillStyle = '#fff'; o.fillRect(0, 0, PW, HEADER_H);
  o.fillStyle = '#000';
  o.textBaseline = 'alphabetic';
  o.font = '200px "Archivo Black", "Arial Black", Impact, sans-serif';
  const m = o.measureText(word);
  const tw = m.actualBoundingBoxLeft + m.actualBoundingBoxRight;
  const th = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
  const sx = TEXT_BOX.w / tw, sy = TEXT_BOX.h / th;
  o.save();
  o.translate(TEXT_BOX.x + m.actualBoundingBoxLeft * sx, TEXT_BOX.y + m.actualBoundingBoxAscent * sy);
  o.scale(sx, sy);
  o.fillText(word, 0, 0);
  o.restore();

  const data = o.getImageData(0, 0, PW, HEADER_H).data;
  const pts = [];
  const s = CFG.spacing;
  let row = 0;
  for (let y = s / 2; y < HEADER_H; y += s * 0.87, row++) {
    for (let x = (row % 2 ? s / 2 : 0) + s / 2; x < PW; x += s) {
      const xi = x | 0, yi = y | 0;
      if (data[(yi * PW + xi) * 4] < 128) {
        pts.push({ x: x + rand(-1, 1), y: y + rand(-1, 1) });
      }
    }
  }
  // 섞기
  for (let i = pts.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    [pts[i], pts[j]] = [pts[j], pts[i]];
  }
  return pts;
}

// ---------- 개미 ----------
function makeAnt(x, y, mode) {
  return {
    x, y, vx: 0, vy: 0,
    h: rand(0, Math.PI * 2),           // 머리 방향
    hx: x, hy: y,                       // 집(글자 위 자리)
    jx: 0, jy: 0,                       // 대기 중 꼼지락
    mode,                               // 'word' | 'wander'
    size: rand(0.85, 1.15) * (mode === 'wander' ? 1.15 : 1),
    maxS: rand(2.4, 3.6),
    phase: rand(0, 6.28),
    seed: rand(0, 1000),
    panic: 0,
    wt: 0,                              // 떠돌이 방향 전환 타이머
  };
}

function buildAnts() {
  const pts = sampleText('DEBUG');
  const word = ants.filter(a => a.mode === 'word');
  const wand = ants.filter(a => a.mode === 'wander');
  // 부족하면 사진 쪽에서 새로 태어나서 기어 올라옴
  while (word.length < pts.length) {
    word.push(makeAnt(rand(20, PW - 20), rand(HEADER_H + 40, 1000), 'word'));
  }
  word.length = pts.length;
  pts.forEach((p, i) => { word[i].hx = p.x; word[i].hy = p.y; });
  while (wand.length < CFG.wanderers) {
    wand.push(makeAnt(rand(40, PW - 40), rand(HEADER_H + 40, 1500), 'wander'));
  }
  ants = word.concat(wand);
}

function scatterAll() {
  for (const a of ants) {
    a.x = rand(20, PW - 20);
    a.y = rand(HEADER_H + 30, 1500);
    a.vx = rand(-2, 2); a.vy = rand(-2, 2);
  }
}

function updateAnt(a, dtf) {
  let tx, ty;
  if (a.mode === 'word') {
    // 자리에 도착하면 가끔 꼼지락
    if (Math.random() < 0.004 * dtf) { a.jx = rand(-1.6, 1.6); a.jy = rand(-1.6, 1.6); }
    tx = a.hx + a.jx; ty = a.hy + a.jy;
  } else {
    // 떠돌이: 머리 방향으로 계속 걷다가 방향을 조금씩 틂
    a.wt -= dtf;
    if (a.wt <= 0) { a.wt = rand(40, 160); a.wdir = a.h + rand(-1.2, 1.2); }
    a.wdir += Math.sin(t * 0.03 + a.seed) * 0.03;
    tx = a.x + Math.cos(a.wdir) * 60;
    ty = a.y + Math.sin(a.wdir) * 60;
  }

  const dx = tx - a.x, dy = ty - a.y;
  const d = Math.hypot(dx, dy) || 0.0001;
  const arrive = 28;
  let sp = a.mode === 'wander' ? a.maxS * 0.45 : (d < arrive ? a.maxS * (d / arrive) : a.maxS);
  let dvx = (dx / d) * sp, dvy = (dy / d) * sp;

  // 이동 중엔 개미처럼 지그재그
  if (d > arrive || a.mode === 'wander') {
    const w = Math.sin(t * 0.18 + a.seed) * 0.45 + Math.sin(t * 0.05 + a.seed * 2) * 0.35;
    const c = Math.cos(w), s = Math.sin(w);
    const rx = dvx * c - dvy * s, ry = dvx * s + dvy * c;
    dvx = rx; dvy = ry;
  }

  let ax = (dvx - a.vx) * 0.14;
  let ay = (dvy - a.vy) * 0.14;

  // 마우스 회피
  if (mouse.inside) {
    const R = mouse.down ? CFG.fleeRadiusHold : CFG.fleeRadius;
    const mx = a.x - mouse.x, my = a.y - mouse.y;
    const md2 = mx * mx + my * my;
    if (md2 < R * R) {
      const md = Math.sqrt(md2) || 0.001;
      let f = 1 - md / R; f = f * f * CFG.fleeForce * 3;
      // 정면으로 밀리지 않고 살짝 옆으로 비켜 달아나게
      const side = (a.seed % 2 < 1 ? 1 : -1) * 0.35;
      ax += (mx / md - (my / md) * side) * f;
      ay += (my / md + (mx / md) * side) * f;
      a.panic = Math.min(1, a.panic + 0.25);
    }
  }

  // 클릭 충격파
  for (const sh of shocks) {
    if (sh.fresh) {
      const mx = a.x - sh.x, my = a.y - sh.y;
      const md = Math.hypot(mx, my) || 0.001;
      if (md < CFG.shockRadius) {
        const f = (1 - md / CFG.shockRadius) * 14;
        a.vx += (mx / md) * f * rand(0.6, 1.2);
        a.vy += (my / md) * f * rand(0.6, 1.2);
        a.panic = 1;
      }
    }
  }

  a.vx += ax * dtf; a.vy += ay * dtf;
  const cap = a.maxS * (1 + a.panic * 1.6);
  const spd = Math.hypot(a.vx, a.vy);
  if (spd > cap) { a.vx *= cap / spd; a.vy *= cap / spd; }
  a.panic *= Math.pow(0.975, dtf);

  a.x += a.vx * dtf; a.y += a.vy * dtf;

  // 포스터 밖으로 못 나가게
  if (a.x < ANT_BOUNDS.x0) { a.x = ANT_BOUNDS.x0; a.vx = Math.abs(a.vx); if (a.mode === 'wander') a.wdir = Math.PI - a.wdir; }
  if (a.x > ANT_BOUNDS.x1) { a.x = ANT_BOUNDS.x1; a.vx = -Math.abs(a.vx); if (a.mode === 'wander') a.wdir = Math.PI - a.wdir; }
  if (a.y < ANT_BOUNDS.y0) { a.y = ANT_BOUNDS.y0; a.vy = Math.abs(a.vy); if (a.mode === 'wander') a.wdir = -a.wdir; }
  if (a.y > ANT_BOUNDS.y1) { a.y = ANT_BOUNDS.y1; a.vy = -Math.abs(a.vy); if (a.mode === 'wander') a.wdir = -a.wdir; }
  if (a.mode === 'wander' && a.y < HEADER_H + 10) a.wdir = Math.abs(a.wdir) % Math.PI; // 떠돌이는 사진 쪽으로

  const s2 = Math.hypot(a.vx, a.vy);
  if (s2 > 0.12) a.h = angLerp(a.h, Math.atan2(a.vy, a.vx), Math.min(1, 0.22 * dtf));
  a.phase += s2 * 0.42 * dtf;
  a.move = Math.min(1, s2 / 1.2);
}

// ---------- 개미 그리기 ----------
// 걷는 동작 프레임을 미리 그려둔 스프라이트를 회전시켜 찍음 (수천 마리도 가볍게)
const LEGS = [ // [기저 x, 끝 x, 끝 y]
  [0.10, 0.38, 0.30],
  [0.04, 0.04, 0.35],
  [-0.02, -0.30, 0.31],
];
const WALK_FRAMES = 8;      // 걷기 프레임 수
const IDLE_FRAMES = 3;      // 멈춰 있을 때 더듬이 까딱 프레임
const SPRITE_MAX = 1.35;    // 스프라이트는 가장 큰 개미 기준으로 그림
const atlas = document.createElement('canvas');
const atx = atlas.getContext('2d');
let cell = 0;

// 개미 한 마리 모양 (로컬 좌표, 오른쪽이 머리)
function antShape(g, L, phase, move, tw, lw) {
  const P = (lx, ly) => [lx * L, ly * L];
  g.beginPath();
  const seg = (lx, rx, ry) => {
    g.moveTo(lx * L + rx * L, 0);
    g.ellipse(lx * L, 0, rx * L, ry * L, 0, 0, Math.PI * 2);
  };
  seg(-0.29, 0.25, 0.155);   // 배
  seg(0.04, 0.145, 0.075);   // 가슴
  seg(0.30, 0.115, 0.10);    // 머리
  g.fill();

  g.beginPath();
  for (let i = 0; i < 3; i++) {                 // 다리 6개 — 삼각 보행
    const [bx, tx, ty] = LEGS[i];
    for (let side = -1; side <= 1; side += 2) {
      const group = ((i % 2 === 0) === (side > 0)) ? 0 : Math.PI;
      const tipx = tx + Math.sin(phase + group) * 0.11 * move;
      const kx = bx + (tipx - bx) * 0.38;
      const [x0, y0] = P(bx, 0), [x1, y1] = P(kx, 0.23 * side), [x2, y2] = P(tipx, ty * side);
      g.moveTo(x0, y0); g.lineTo(x1, y1); g.lineTo(x2, y2);
    }
  }
  for (let side = -1; side <= 1; side += 2) {   // 더듬이
    const [x0, y0] = P(0.38, 0.04 * side);
    const [x1, y1] = P(0.50, (0.15 + tw * side) * side);
    const [x2, y2] = P(0.64, (0.12 - tw) * side);
    g.moveTo(x0, y0); g.lineTo(x1, y1); g.lineTo(x2, y2);
  }
  g.lineWidth = lw;
  g.stroke();
}

function buildAtlas() {
  const L = CFG.antLen * SPRITE_MAX * k * dpr;     // 디바이스 픽셀 기준 몸길이
  cell = Math.ceil(L * 1.5) + 2;
  const n = WALK_FRAMES + IDLE_FRAMES;
  atlas.width = cell * n; atlas.height = cell;
  atx.clearRect(0, 0, atlas.width, atlas.height);
  atx.fillStyle = CFG.ink; atx.strokeStyle = CFG.ink;
  atx.lineCap = 'round'; atx.lineJoin = 'round';
  // 밝은 사진 위에서도 흰 개미가 보이도록 옅은 그림자 (검은 헤더에선 안 보임)
  atx.shadowColor = 'rgba(0,0,0,0.45)'; atx.shadowBlur = Math.max(1.2, L * 0.09);
  const lw = Math.max(1.0, 0.085 * L);
  for (let f = 0; f < n; f++) {
    atx.save();
    atx.translate(f * cell + cell / 2, cell / 2);
    if (f < WALK_FRAMES) antShape(atx, L, (f / WALK_FRAMES) * Math.PI * 2, 1, 0, lw);
    else antShape(atx, L, 0, 0, [-0.05, 0, 0.05][f - WALK_FRAMES], lw);
    atx.restore();
  }
}

function drawAnts() {
  const base = dpr * k;
  const half = cell / 2;
  for (const a of ants) {
    let f;
    if ((a.move || 0) > 0.25) {
      f = Math.floor(((a.phase % (Math.PI * 2)) / (Math.PI * 2)) * WALK_FRAMES) % WALK_FRAMES;
    } else {
      const s = Math.sin(t * 0.12 + a.seed);
      f = WALK_FRAMES + (s < -0.33 ? 0 : s > 0.33 ? 2 : 1);
    }
    const sc = a.size / SPRITE_MAX;
    const c = Math.cos(a.h) * sc, s = Math.sin(a.h) * sc;
    ctx.setTransform(c, s, -s, c, dpr * ox + a.x * base, dpr * oy + a.y * base);
    ctx.drawImage(atlas, f * cell, 0, cell, cell, -half, -half, cell, cell);
  }
  ctx.setTransform(base, 0, 0, base, dpr * ox, dpr * oy);
}

// ---------- 배경(정적인 포스터 부분) ----------
function renderBg() {
  bg.width = canvas.width; bg.height = canvas.height;
  bgx.setTransform(1, 0, 0, 1, 0, 0);
  bgx.fillStyle = '#0a0a0a';
  bgx.fillRect(0, 0, bg.width, bg.height);
  bgx.setTransform(dpr * k, 0, 0, dpr * k, dpr * ox, dpr * oy);
  bgx.imageSmoothingQuality = 'high';
  bgx.fillStyle = '#000';
  bgx.fillRect(0, 0, PW, PH);
  bgx.fillStyle = CFG.paper;
  bgx.fillRect(0, 0, PW, HEADER_H);
  if (imgHead.complete && imgHead.naturalWidth) bgx.drawImage(imgHead, 852, 0);
  if (imgBody.complete && imgBody.naturalWidth) bgx.drawImage(imgBody, 0, HEADER_H);
}

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  vw = window.innerWidth; vh = window.innerHeight;
  canvas.width = Math.round(vw * dpr);
  canvas.height = Math.round(vh * dpr);
  k = Math.min(vw / PW, vh / PH);
  ox = (vw - PW * k) / 2; oy = (vh - PH * k) / 2;
  renderBg();
  buildAtlas();
}

// ---------- 입력 ----------
function toPoster(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left - ox) / k, y: (e.clientY - r.top - oy) / k };
}
canvas.addEventListener('pointermove', e => {
  const p = toPoster(e); mouse.x = p.x; mouse.y = p.y; mouse.inside = true;
});
canvas.addEventListener('pointerdown', e => {
  const p = toPoster(e); mouse.x = p.x; mouse.y = p.y; mouse.inside = true; mouse.down = true;
  shocks.push({ x: p.x, y: p.y, r: 0, life: 1, fresh: true });
});
window.addEventListener('pointerup', () => { mouse.down = false; });
canvas.addEventListener('pointerleave', () => { mouse.inside = false; mouse.down = false; });
window.addEventListener('keydown', e => { if (e.key === 'r' || e.key === 'R') scatterAll(); });
window.addEventListener('resize', resize);

// ---------- 루프 ----------
let last = performance.now();
function frame(now) {
  const dtf = Math.min(2.5, (now - last) / 16.667);
  last = now; t += dtf;

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(bg, 0, 0);
  ctx.setTransform(dpr * k, 0, 0, dpr * k, dpr * ox, dpr * oy);

  for (const a of ants) updateAnt(a, dtf);
  for (const sh of shocks) sh.fresh = false;

  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, PW, 1541); ctx.clip();
  drawAnts();

  // 충격파 링
  for (let i = shocks.length - 1; i >= 0; i--) {
    const sh = shocks[i];
    sh.r += (CFG.shockRadius - sh.r) * 0.12 * dtf;
    sh.life -= 0.035 * dtf;
    if (sh.life <= 0) { shocks.splice(i, 1); continue; }
    ctx.beginPath();
    ctx.arc(sh.x, sh.y, sh.r, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255,255,255,${sh.life * 0.55})`;
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // 마우스 반경 표시 (디버거 렌즈)
  if (mouse.inside) {
    const R = mouse.down ? CFG.fleeRadiusHold : CFG.fleeRadius;
    const onHeader = mouse.y < HEADER_H;
    ctx.beginPath();
    ctx.arc(mouse.x, mouse.y, R, 0, Math.PI * 2);
    ctx.setLineDash([4, 6]);
    ctx.strokeStyle = onHeader ? 'rgba(255,255,255,0.35)' : 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.restore();

  requestAnimationFrame(frame);
}

// ---------- 시작 ----------
async function start() {
  resize();
  const timeout = new Promise(r => setTimeout(r, 2500));
  try { await Promise.race([document.fonts.load('200px "Archivo Black"'), timeout]); } catch (e) {}
  await Promise.all([imgBody.decode().catch(() => {}), imgHead.decode().catch(() => {})]);
  renderBg();
  buildAnts();
  requestAnimationFrame(t0 => { last = t0; requestAnimationFrame(frame); });
}
start();
</script>
</body>
</html>
