<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DEBUG — Digital Art Exhibition 2026</title>
<meta name="description" content="DEBUG 연세대학교 디지털아트 졸업전시 2026 · 12.3–12.6 · 무악로터리 B1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=block" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --fg: #f4f2ee;
    --dim: rgba(244, 242, 238, 0.55);
    --faint: rgba(244, 242, 238, 0.14);
    --mono: "Space Mono", "IBM Plex Sans KR", ui-monospace, monospace;
    --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); color: var(--fg); scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans);
         -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  body.locked { overflow: hidden; }

  /* ---------- 1. 포스터 ---------- */
  #poster { position: relative; height: 100vh; height: 100svh; }
  #c { position: absolute; inset: 0; display: block; width: 100%; height: 100%; outline: none;
       touch-action: pan-y; /* 세로로 밀면 스크롤, 그 외엔 개미와 놀기 */
       cursor: crosshair; -webkit-user-select: none; user-select: none;
       -webkit-tap-highlight-color: transparent; }
  #hint { position: absolute; top: max(14px, env(safe-area-inset-top)); right: 16px; z-index: 2;
           font: 400 11px/1 var(--mono); letter-spacing: .24em; color: var(--fg); opacity: .7;
           text-decoration: none; padding: 8px 4px; mix-blend-mode: difference; }
  #hint.blink { animation: blink 1.6s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---------- 2. 평면도 ---------- */
  #plan { min-height: 100vh; padding: clamp(72px, 12vh, 140px) clamp(16px, 5vw, 72px) 64px;
          max-width: 1320px; margin: 0 auto; }
  .plan-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px;
               flex-wrap: wrap; border-bottom: 1px solid var(--faint); padding-bottom: 18px; margin-bottom: clamp(28px, 6vh, 56px); }
  .plan-head h2 { margin: 0; font: 400 clamp(28px, 4.4vw, 56px)/1 var(--mono); letter-spacing: -0.02em; }
  .plan-head p { margin: 0; font: 400 13px/1.7 var(--mono); color: var(--dim); }
  .plan-head .hint { color: var(--fg); }

  .plan-wrap { position: relative; }
  #map { display: block; width: 100%; height: auto; max-height: 86svh; overflow: visible; }
  #map .grid line { stroke: var(--faint); stroke-width: 1; }
  #map .axis { stroke: rgba(244,242,238,.28); stroke-width: 1; stroke-dasharray: 6 6; }
  #map .wall { fill: none; stroke: var(--fg); stroke-width: 2.4; stroke-linejoin: miter; }
  #map .room { fill: #000; stroke: var(--fg); stroke-width: 1.8; }
  #map .dash { fill: none; stroke: rgba(244,242,238,.45); stroke-width: 1.2; stroke-dasharray: 8 7; }
  #map .vert { fill: #000; stroke: var(--fg); stroke-width: 1.6; }

  /* 선이 그려지는 등장 애니메이션 */
  #map .draw { stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 1.6s cubic-bezier(.6,0,.2,1); }
  #map.in .draw { stroke-dashoffset: 0; }
  #map .room.draw { fill-opacity: 0; transition: stroke-dashoffset 1.4s cubic-bezier(.6,0,.2,1), fill-opacity .6s .9s; }
  #map.in .room.draw { fill-opacity: 1; }
  #map .dash.draw { stroke-dasharray: 8 7; stroke-dashoffset: 0; opacity: 0; transition: opacity .8s 1.2s; }
  #map.in .dash.draw { opacity: 1; }

  /* 작가 원 */
  .dot { cursor: pointer; outline: none; }
  .dot .hit { fill: transparent; }
  .dot .ring { fill: #000; stroke: var(--fg); stroke-width: 2.2;
               transform-box: fill-box; transform-origin: center; transform: scale(0);
               transition: transform .5s cubic-bezier(.3,1.6,.5,1), fill .2s; }
  #map.in .dot .ring { transform: scale(1); }
  .dot .pulse { fill: none; stroke: var(--fg); stroke-width: 1.2; opacity: 0;
                transform-box: fill-box; transform-origin: center; }
  #map.in .dot .pulse { animation: pulse 2.8s ease-out infinite; animation-delay: var(--d, 0s); }
  @keyframes pulse { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(1.9); opacity: 0; } }
  .dot .name { fill: var(--fg); font: 600 21px var(--sans); text-anchor: middle; dominant-baseline: central;
               opacity: 0; transition: opacity .2s; pointer-events: none; }
  .dot:hover .ring, .dot:focus-visible .ring, .dot.hl .ring { transform: scale(1.18); }
  .dot:hover .name, .dot:focus-visible .name, .dot.hl .name { opacity: 1; }
  .dot.active .ring { fill: var(--fg); }
  .dot.active .name { fill: #000; opacity: 1; }
  .dot:focus-visible .ring { stroke-width: 4; }

  /* 작가 목록 */
  .index { list-style: none; margin: clamp(36px, 7vh, 64px) 0 0; padding: 18px 0 0; border-top: 1px solid var(--faint);
           display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px 16px; }
  .index button { all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: flex; gap: 12px; align-items: baseline;
                  padding: 10px 0; border-bottom: 1px solid transparent; font: 600 17px var(--sans); }
  .index button span { font: 400 11px var(--mono); color: var(--dim); }
  .index button:hover, .index button:focus-visible, .index button.active { border-bottom-color: var(--fg); }
  .site-foot { margin-top: 72px; font: 400 11px/1.8 var(--mono); color: var(--dim); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }

  /* ---------- 3. 작가노트 패널 ---------- */
  #scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 9; }
  #scrim.open { opacity: 1; pointer-events: auto; }
  #sheet { position: fixed; top: 0; right: 0; height: 100%; width: min(460px, 100%); z-index: 10;
           background: #000; border-left: 1px solid var(--fg); display: flex; flex-direction: column;
           transform: translateX(102%); transition: transform .45s cubic-bezier(.7,0,.2,1); visibility: hidden; }
  #sheet.open { transform: none; visibility: visible; }
  .sheet-bar { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px;
               border-bottom: 1px solid var(--faint); font: 400 12px var(--mono); color: var(--dim); }
  .sheet-bar button { all: unset; cursor: pointer; font: 400 26px/1 var(--mono); color: var(--fg); padding: 4px 8px; margin: -4px -8px; }
  .sheet-body { flex: 1; overflow-y: auto; padding: 28px 24px 40px; overscroll-behavior: contain; }
  .s-kicker { margin: 0 0 6px; font: 400 11px var(--mono); letter-spacing: .2em; color: var(--dim); }
  #s-name { margin: 0; font: 700 clamp(40px, 9vw, 56px)/1.05 var(--sans); letter-spacing: -0.02em; }
  #s-title { margin: 18px 0 4px; font: 600 19px/1.4 var(--sans); }
  #s-medium { margin: 0; font: 400 12px/1.6 var(--mono); color: var(--dim); }
  #s-fig { margin: 24px 0 0; aspect-ratio: 4 / 3; border: 1px dashed var(--faint); display: grid; place-items: center;
           font: 400 11px var(--mono); color: var(--dim); overflow: hidden; }
  #s-fig img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #s-fig.has-img { border: 0; }
  .sheet-body h3 { margin: 34px 0 10px; font: 700 11px var(--mono); letter-spacing: .2em; color: var(--dim);
                   padding-bottom: 8px; border-bottom: 1px solid var(--faint); }
  .sheet-body .txt p { margin: 0 0 1em; font: 400 15px/1.85 var(--sans); word-break: keep-all; }
  .sheet-body .txt.placeholder p { color: var(--dim); }
  #s-link { display: inline-block; margin-top: 18px; font: 400 12px var(--mono); color: var(--fg); }
  #s-link:empty { display: none; }
  .sheet-nav { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--faint); }
  .sheet-nav button { all: unset; cursor: pointer; padding: 18px 20px; font: 400 12px var(--mono); }
  .sheet-nav button + button { text-align: right; border-left: 1px solid var(--faint); }
  .sheet-nav button:hover, .sheet-nav button:focus-visible { background: var(--fg); color: #000; }

  /* 폰: 아래에서 올라오는 시트 */
  @media (max-width: 640px) {
    #sheet { top: auto; bottom: 0; height: 88svh; width: 100%; border-left: 0; border-top: 1px solid var(--fg);
             transform: translateY(102%); }
    .sheet-body { padding: 22px 20px 32px; }
    .plan-head { align-items: flex-start; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hint = document.getElementById('hint');
let dpr = 1, vw = 0, vh = 0, k = 1, ox = 0, oy = 0;
const bg = document.createElement('canvas'), bgx = bg.getContext('2d');
const cover = document.createElement('canvas'), cvx = cover.getContext('2d');
const fg = document.createElement('canvas'), fgx = fg.getContext('2d');
const photo = new Image(); photo.src = IMG_PHOTO;
const txt = new Image(); txt.src = IMG_TEXT;

const rand = (a, b) => a + Math.random() * (b - a);
function angLerp(a, b, f) {
  let d = b - a;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return a + d * f;
}

// ---------- 검정 면 = 칸들의 모음 ----------
const C = CFG.cell;
const cells = [];
for (let y = 0; y < PH; y += C) {
  for (let x = 0; x < PW; x += C) {
    cells.push({ x, y, w: Math.min(C, PW - x), h: Math.min(C, PH - y),
                 cx: x + Math.min(C, PW - x) / 2, cy: y + Math.min(C, PH - y) / 2,
                 a: 1, ta: 1, ant: null, wd: 0 });
  }
}
const fading = new Set();
let ants = [];
let state = 'cover';            // 'cover' | 'out' | 'in'
let wave = null, pending = [], pIdx = 0;
let t = 0, dirty = true;
const mouse = { x: -9999, y: -9999, inside: false, touch: false };

function paintCell(c) {
  const s = k * dpr;
  const x0 = Math.floor(c.x * s), x1 = Math.floor((c.x + c.w) * s);
  const y0 = Math.floor(c.y * s), y1 = Math.floor((c.y + c.h) * s);
  cvx.clearRect(x0, y0, x1 - x0, y1 - y0);
  if (c.a > 0) {
    cvx.globalAlpha = c.a;
    cvx.fillRect(x0, y0, x1 - x0, y1 - y0);
    cvx.globalAlpha = 1;
  }
}

// ---------- 개미 ----------
function makeAnt(x, y, cell, mode) {
  const a = {
    x, y, vx: 0, vy: 0, cell, mode,
    h: rand(0, Math.PI * 2), dir: 0,
    size: rand(0.85, 1.15),
    maxS: mode === 'home' ? rand(5, 8) : rand(4.5, 8.5),
    phase: rand(0, 6.28), seed: rand(0, 1000),
    delay: 0, panic: 0, move: 0, wt: 0, wdir: rand(0, 6.28),
  };
  cell.ant = a;
  ants.push(a);
  return a;
}

// 클릭 → 검정이 개미로 부서지며 흩어짐
function startOut(px, py) {
  state = 'out';
  wave = { x: px, y: py, r: 0 };
  pending = [];
  for (const c of cells) {
    if (c.ta === 1) {
      c.wd = Math.hypot(c.cx - px, c.cy - py) + Math.random() * CFG.waveJitter;
      pending.push(c);
    } else if (c.ant) {                 // 돌아오던 개미는 다시 도망
      const a = c.ant;
      a.mode = 'flee';
      a.dir = Math.atan2(a.y - py, a.x - px) + rand(-0.6, 0.6);
      a.delay = 0;
    }
  }
  pending.sort((a, b) => a.wd - b.wd);
  pIdx = 0;
  setHint();
}

function activate(c, stayProb) {
  c.ta = 0; fading.add(c);
  const a = makeAnt(c.cx + rand(-2, 2), c.cy + rand(-2, 2), c, Math.random() < stayProb ? 'wander' : 'flee');
  a.dir = Math.atan2(c.cy - wave.y, c.cx - wave.x) + rand(-0.7, 0.7);
  a.h = a.dir + rand(-0.8, 0.8);
  a.delay = rand(0, 12);
}

// 다시 클릭 → 개미들이 돌아와 검정을 다시 채움
function startIn() {
  state = 'in';
  pending = []; pIdx = 0; wave = null;
  for (const c of cells) {
    if (c.ta === 1) continue;
    if (c.ant) {
      c.ant.mode = 'home';
      c.ant.maxS = rand(5, 8);
      c.ant.delay = rand(0, 15);
      continue;
    }
    // 가장 가까운 가장자리 바깥에서 출발
    const dl = c.cx, dr = PW - c.cx, dt = c.cy, db = PH - c.cy;
    let edge = [dl, dr, dt, db].indexOf(Math.min(dl, dr, dt, db));
    if (Math.random() < 0.25) edge = (Math.random() * 4) | 0;
    const off = rand(30, 260);
    let x, y;
    if (edge === 0) { x = -off; y = c.cy + rand(-120, 120); }
    else if (edge === 1) { x = PW + off; y = c.cy + rand(-120, 120); }
    else if (edge === 2) { y = -off; x = c.cx + rand(-120, 120); }
    else { y = PH + off; x = c.cx + rand(-120, 120); }
    const a = makeAnt(x, y, c, 'home');
    a.h = Math.atan2(c.cy - y, c.cx - x);
    a.delay = rand(0, 45);
  }
  setHint();
}

function toggle(px, py) {
  if (state === 'out') startIn();
  else startOut(px, py);
}

function updateAnt(a, dtf) {
  if (a.delay > 0) { a.delay -= dtf; a.move = 0; return; }
  let dvx, dvy, steer;
  if (a.mode === 'flee') {
    a.dir += Math.sin(t * 0.05 + a.seed) * 0.025 * dtf;
    dvx = Math.cos(a.dir) * a.maxS; dvy = Math.sin(a.dir) * a.maxS;
    steer = 0.07;
  } else if (a.mode === 'wander') {
    a.wt -= dtf;
    if (a.wt <= 0) { a.wt = rand(40, 160); a.wdir = a.h + rand(-1.2, 1.2); }
    a.wdir += Math.sin(t * 0.03 + a.seed) * 0.03;
    if (a.x < 30) a.wdir = 0; else if (a.x > PW - 30) a.wdir = Math.PI;
    if (a.y < 30) a.wdir = Math.PI / 2; else if (a.y > PH - 30) a.wdir = -Math.PI / 2;
    dvx = Math.cos(a.wdir) * 1.5; dvy = Math.sin(a.wdir) * 1.5;
    steer = 0.12;
  } else { // home
    const dx = a.cell.cx - a.x, dy = a.cell.cy - a.y;
    const d = Math.hypot(dx, dy) || 0.0001;
    if (d < 2.5) { arrive(a); return true; }
    const sp = d < 30 ? a.maxS * Math.max(0.15, d / 30) : a.maxS;
    dvx = dx / d * sp; dvy = dy / d * sp;
    steer = 0.16;
  }
  // 개미처럼 지그재그
  if (a.mode !== 'home' || Math.hypot(a.cell.cx - a.x, a.cell.cy - a.y) > 30) {
    const w = Math.sin(t * 0.18 + a.seed) * 0.4 + Math.sin(t * 0.05 + a.seed * 2) * 0.3;
    const c = Math.cos(w), s = Math.sin(w);
    const rx = dvx * c - dvy * s, ry = dvx * s + dvy * c;
    dvx = rx; dvy = ry;
  }
  let ax = (dvx - a.vx) * steer, ay = (dvy - a.vy) * steer;

  // 돌아오는 개미는 자기 자리에 가까워지면(또는 오래 헤매면) 마우스를 무시하고 덮어버림
  let scared = mouse.inside;
  if (a.mode === 'home') {
    a.age = (a.age || 0) + dtf;
    if (a.age > 150 || Math.hypot(a.cell.cx - a.x, a.cell.cy - a.y) < CFG.fleeRadiusTouch * 1.3) scared = false;
  } else a.age = 0;
  if (scared) {
    const R = mouse.touch ? CFG.fleeRadiusTouch : CFG.fleeRadius;
    const mx = a.x - mouse.x, my = a.y - mouse.y, md2 = mx * mx + my * my;
    if (md2 < R * R) {
      const md = Math.sqrt(md2) || 0.001;
      let f = 1 - md / R; f = f * f * 4.8;
      const side = (a.seed % 2 < 1 ? 1 : -1) * 0.35;
      ax += (mx / md - (my / md) * side) * f;
      ay += (my / md + (mx / md) * side) * f;
      a.panic = Math.min(1, a.panic + 0.25);
    }
  }
  a.vx += ax * dtf; a.vy += ay * dtf;
  const cap = a.maxS * (1 + a.panic * 1.5);
  const spd = Math.hypot(a.vx, a.vy);
  if (spd > cap) { a.vx *= cap / spd; a.vy *= cap / spd; }
  a.panic *= Math.pow(0.975, dtf);
  a.x += a.vx * dtf; a.y += a.vy * dtf;

  const s2 = Math.hypot(a.vx, a.vy);
  if (s2 > 0.12) a.h = angLerp(a.h, Math.atan2(a.vy, a.vx), Math.min(1, 0.22 * dtf));
  a.phase += s2 * 0.42 * dtf;
  a.move = Math.min(1, s2 / 1.2);

  if (a.mode === 'flee' && (a.x < -50 || a.x > PW + 50 || a.y < -50 || a.y > PH + 50)) {
    a.cell.ant = null;
    return true;   // 화면 밖으로 나감 → 제거
  }
  return false;
}

function arrive(a) {
  const c = a.cell;
  c.ant = null;
  c.ta = 1; fading.add(c);
}

// ---------- 개미 스프라이트 ----------
const LEGS = [[0.10, 0.38, 0.30], [0.04, 0.04, 0.35], [-0.02, -0.30, 0.31]];
const WALK = 8, IDLE = 3, SMAX = 1.3;
const atlas = document.createElement('canvas'), atx = atlas.getContext('2d');
let sprite = 0;

function antShape(g, L, phase, move, tw, lw) {
  g.beginPath();
  const seg = (lx, rx, ry) => { g.moveTo(lx * L + rx * L, 0); g.ellipse(lx * L, 0, rx * L, ry * L, 0, 0, Math.PI * 2); };
  seg(-0.29, 0.25, 0.155); seg(0.04, 0.145, 0.075); seg(0.30, 0.115, 0.10);
  g.fill();
  g.beginPath();
  for (let i = 0; i < 3; i++) {
    const [bx, tx, ty] = LEGS[i];
    for (let side = -1; side <= 1; side += 2) {
      const group = ((i % 2 === 0) === (side > 0)) ? 0 : Math.PI;
      const tipx = tx + Math.sin(phase + group) * 0.11 * move;
      const kx = bx + (tipx - bx) * 0.38;
      g.moveTo(bx * L, 0); g.lineTo(kx * L, 0.23 * side * L); g.lineTo(tipx * L, ty * side * L);
    }
  }
  for (let side = -1; side <= 1; side += 2) {
    g.moveTo(0.38 * L, 0.04 * side * L);
    g.lineTo(0.50 * L, (0.15 + tw * side) * side * L);
    g.lineTo(0.64 * L, (0.12 - tw) * side * L);
  }
  g.lineWidth = lw; g.stroke();
}

function buildAtlas() {
  const L = CFG.antLen * SMAX * k * dpr;
  sprite = Math.ceil(L * 1.5) + 2;
  atlas.width = sprite * (WALK + IDLE); atlas.height = sprite;
  atx.fillStyle = CFG.ink; atx.strokeStyle = CFG.ink;
  atx.lineCap = 'round'; atx.lineJoin = 'round';
  const lw = Math.max(1, 0.085 * L);
  for (let f = 0; f < WALK + IDLE; f++) {
    atx.save(); atx.translate(f * sprite + sprite / 2, sprite / 2);
    if (f < WALK) antShape(atx, L, f / WALK * Math.PI * 2, 1, 0, lw);
    else antShape(atx, L, 0, 0, [-0.05, 0, 0.05][f - WALK], lw);
    atx.restore();
  }
}

function drawAnts() {
  const base = dpr * k, half = sprite / 2;
  for (const a of ants) {
    let f;
    if (a.move > 0.25) f = Math.floor((a.phase % 6.2832) / 6.2832 * WALK) % WALK;
    else { const s = Math.sin(t * 0.12 + a.seed); f = WALK + (s < -0.33 ? 0 : s > 0.33 ? 2 : 1); }
    const sc = a.size / SMAX, c = Math.cos(a.h) * sc, s = Math.sin(a.h) * sc;
    ctx.setTransform(c, s, -s, c, dpr * ox + a.x * base, dpr * oy + a.y * base);
    ctx.drawImage(atlas, f * sprite, 0, sprite, sprite, -half, -half, sprite, sprite);
  }
}

// ---------- 레이어 준비 ----------
function resize(force) {
  const nd = Math.min(window.devicePixelRatio || 1, 2);
  const r = canvas.getBoundingClientRect();
  if (!force && nd === dpr && r.width === vw && r.height === vh) return;
  dpr = nd; vw = r.width; vh = r.height;
  canvas.width = Math.round(vw * dpr); canvas.height = Math.round(vh * dpr);
  k = Math.min(vw / PW, vh / PH);
  ox = (vw - PW * k) / 2; oy = (vh - PH * k) / 2;
  const s = k * dpr;

  bg.width = canvas.width; bg.height = canvas.height;
  bgx.fillStyle = '#000'; bgx.fillRect(0, 0, bg.width, bg.height);
  bgx.imageSmoothingQuality = 'high';
  if (photo.naturalWidth) bgx.drawImage(photo, dpr * ox, dpr * oy, PW * s, PH * s);

  cover.width = Math.floor(PW * s); cover.height = Math.floor(PH * s);
  cvx.fillStyle = CFG.ink;
  for (const c of cells) if (c.a > 0) paintCell(c);

  fg.width = Math.ceil(PW * s); fg.height = Math.ceil((PH - TEXT_Y) * s);
  fgx.imageSmoothingQuality = 'high';
  if (txt.naturalWidth) fgx.drawImage(txt, 0, 0, fg.width, fg.height);

  buildAtlas();
  dirty = true;
}

// ---------- 입력 ----------
function toPoster(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left - ox) / k, y: (e.clientY - r.top - oy) / k };
}
canvas.addEventListener('pointermove', e => {
  mouse.touch = e.pointerType === 'touch';
  const p = toPoster(e); mouse.x = p.x; mouse.y = p.y; mouse.inside = true;
});
canvas.addEventListener('pointerdown', e => {
  mouse.touch = e.pointerType === 'touch';
  const p = toPoster(e); mouse.x = p.x; mouse.y = p.y; mouse.inside = true;
});
window.addEventListener('pointerup', e => { if (e.pointerType === 'touch') mouse.inside = false; });
window.addEventListener('pointercancel', () => { mouse.inside = false; });
canvas.addEventListener('pointerleave', () => { mouse.inside = false; });
canvas.addEventListener('click', e => { const p = toPoster(e); toggle(p.x, p.y); });
canvas.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(PW / 2, PH * 0.45); }
});
canvas.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(() => resize()).observe(canvas);

function setHint() {
  if (!hint) return;
  const covered = state !== 'out';
  hint.textContent = covered ? 'CLICK' : 'SCROLL ↓';
  hint.classList.toggle('blink', covered);
}
if (hint) hint.addEventListener('click', e => {
  if (state !== 'out') { e.preventDefault(); toggle(PW / 2, PH * 0.45); }
});

let posterOn = true;
if (window.IntersectionObserver) new IntersectionObserver(es => { posterOn = es[0].isIntersecting; }).observe(canvas);

// ---------- 루프 ----------
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dtf = Math.min(2.5, (now - last) / 16.667);
  last = now;
  if (!posterOn) return;
  const idle = state === 'cover' && !fading.size && !ants.length;
  if (idle && !dirty) return;          // 평평한 검정일 땐 그릴 필요 없음
  t += dtf;

  // 퍼지는 파동이 지나간 칸 → 개미로
  if (state === 'out' && pIdx < pending.length) {
    wave.r += CFG.waveSpeed * dtf;
    const stayProb = CFG.stayers / pending.length;
    while (pIdx < pending.length && pending[pIdx].wd <= wave.r) activate(pending[pIdx++], stayProb);
  }
  // 칸 사라지기 / 다시 채워지기
  for (const c of fading) {
    const step = dtf / (c.ta > c.a ? CFG.fadeIn : CFG.fadeOut);
    c.a = c.ta > c.a ? Math.min(c.ta, c.a + step) : Math.max(c.ta, c.a - step);
    paintCell(c);
    if (c.a === c.ta) fading.delete(c);
  }
  // 개미 이동 (나간 개미/도착한 개미 제거)
  for (let i = ants.length - 1; i >= 0; i--) {
    if (updateAnt(ants[i], dtf)) { ants[i] = ants[ants.length - 1]; ants.pop(); }
  }
  if (state === 'in' && !ants.length && !fading.size) { state = 'cover'; setHint(); }

  // 그리기: 사진 → 검정 덮개 → 개미 → 글자
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(bg, 0, 0);
  ctx.drawImage(cover, Math.round(dpr * ox), Math.round(dpr * oy));
  ctx.save();
  ctx.beginPath(); ctx.rect(dpr * ox, dpr * oy, PW * k * dpr, PH * k * dpr); ctx.clip();
  drawAnts();
  ctx.restore();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(fg, Math.round(dpr * ox), Math.round(dpr * (oy + TEXT_Y * k)));
  dirty = false;
}

(async () => {
  await Promise.all([photo.decode().catch(() => {}), txt.decode().catch(() => {})]);
  resize(true);
  setHint();
  requestAnimationFrame(t0 => { last = t0; requestAnimationFrame(frame); });
})();
})();

</script>

<script>
/* =========================================================
   작가 정보 — 여기만 고치면 됩니다
   - name: 평면도에 숨겨진 이름 (원에 마우스를 올리면 보임)
   - x, y: 평면도 위 원의 위치 (아래 평면도 좌표 기준)
   - title / medium / note / desc: 작품 제목, 매체·연도, 작가노트, 작품 설명
     (문단은 빈 줄 하나로 구분)
   - image: 작품 사진 주소 (예: 'images/yeonsu.jpg'), 없으면 '' 로 두기
   - link: 인스타그램/포트폴리오 주소, 없으면 ''
   - id: 주소 끝에 붙는 이름 → 예) .../#yeonsu 로 열면 바로 그 작가가 열림
   ========================================================= */
const ARTISTS = [
  { id: 'yeonsu',    name: '연수', x: 95,  y: 46,  title: '', medium: '', image: '', link: '', note: '', desc: '' },
  { id: 'sangmin',   name: '상민', x: 95,  y: 360, title: '', medium: '', image: '', link: '', note: '', desc: '' },
  { id: 'chaerim',   name: '채림', x: 325, y: 384, title: '', medium: '', image: '', link: '', note: '', desc: '' },
  { id: 'geonhyeok', name: '건혁', x: 452, y: 222, title: '', medium: '', image: '', link: '', note: '', desc: '' },
  { id: 'seoyeon',   name: '서연', x: 566, y: 222, title: '', medium: '', image: '', link: '', note: '', desc: '' },
  { id: 'sangwoong', name: '상웅', x: 739, y: 158, title: '', medium: '', image: '', link: '', note: '', desc: '' },
  { id: 'yeeun',     name: '예은', x: 715, y: 421, title: '', medium: '', image: '', link: '', note: '', desc: '' },
  { id: 'narim',     name: '나림', x: 876, y: 421, title: '', medium: '', image: '', link: '', note: '', desc: '' },
  { id: 'hyeonjun',  name: '현준', x: 1062, y: 362, title: '', medium: '', image: '', link: '', note: '', desc: '' },
];

// 비어 있을 때 보여줄 안내 문구
const PLACEHOLDER = {
  title: '작품 제목',
  medium: '매체 · 크기 · 2026',
  note: '여기에 작가노트를 넣어 주세요.\n\n작업을 시작하게 된 계기, 붙잡고 있는 질문, 이번 전시에서 보여주고 싶은 것을 자유롭게 적으면 됩니다.',
  desc: '여기에 작품 설명을 넣어 주세요.\n\n관객이 무엇을 보고 어떻게 경험하는지, 사용한 재료와 기술, 인터랙션 방법 등을 적으면 됩니다.',
};

/* ---------- 평면도 도형 (원본 도면을 따라 그린 좌표, 단위 = 픽셀) ---------- */
const PLAN = {
  outline: 'M0 0 H993 L1154 162 V453 H0 Z',
  rooms: [               // [x, y, 너비, 높이]
    [0, 0, 186, 93],       // 연수
    [0, 269, 186, 184],    // 상민
    [212, 314, 227, 139],  // 채림
    [461, 135, 48, 184],   // 건혁 벽 1
    [509, 135, 22, 184],   // 건혁 벽 2
    [531, 158, 70, 139],   // 서연
    [669, 88, 140, 140],   // 상웅
    [646, 388, 138, 65],   // 예은
    [784, 388, 185, 65],   // 나림
    [969, 250, 185, 19],   // 현준 앞 선반
    [969, 269, 185, 184],  // 현준
  ],
  dashes: ['M212 314 L439 453', 'M439 314 L212 453'],
  verts: [[0,0],[186,0],[0,93],[0,111],[993,0],[1154,162],[1154,453],[0,453],[324,453]],
  axes: ['M577 -58 V511', 'M-58 227 H1212'],
};
const DOT_R = 34;            // 원 반지름
const VB = { x: -58, y: -58, w: 1270, h: 569 };

const NS = 'http://www.w3.org/2000/svg';
const map = document.getElementById('map');
const el = (tag, attrs = {}, parent) => {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
};
const rectPath = ([x, y, w, h]) => `M${x} ${y} H${x + w} V${y + h} H${x} Z`;

const root = el('g', {}, map);
// 모눈
const grid = el('g', { class: 'grid' }, root);
for (let x = VB.x; x <= VB.x + VB.w; x += 57.7) el('line', { x1: x, y1: VB.y, x2: x, y2: VB.y + VB.h }, grid);
for (let y = VB.y + 22; y <= VB.y + VB.h; y += 57.7) el('line', { x1: VB.x, y1: y, x2: VB.x + VB.w, y2: y }, grid);
PLAN.axes.forEach(d => el('path', { d, class: 'axis' }, root));

// 벽과 부스
el('path', { d: PLAN.outline, class: 'wall draw', pathLength: 1 }, root);
PLAN.rooms.forEach((r, i) => {
  const p = el('path', { d: rectPath(r), class: 'room draw', pathLength: 1 }, root);
  p.style.transitionDelay = `${0.25 + i * 0.07}s, ${0.9 + i * 0.05}s`;
});
PLAN.dashes.forEach(d => el('path', { d, class: 'dash draw' }, root));
PLAN.verts.forEach(([x, y]) => el('circle', { cx: x, cy: y, r: 4.5, class: 'vert' }, root));

// 작가 원
const dots = ARTISTS.map((a, i) => {
  const g = el('g', { class: 'dot', tabindex: 0, role: 'button', 'aria-label': `${a.name} 작가노트 보기`, 'data-i': i }, root);
  el('circle', { cx: a.x, cy: a.y, r: DOT_R + 12, class: 'hit' }, g);
  const pulse = el('circle', { cx: a.x, cy: a.y, r: DOT_R, class: 'pulse' }, g);
  pulse.style.setProperty('--d', `${(i * 0.31) % 2.8}s`);
  const ring = el('circle', { cx: a.x, cy: a.y, r: DOT_R, class: 'ring' }, g);
  ring.style.transitionDelay = `${1.3 + i * 0.06}s`;
  const label = el('text', { x: a.x, y: a.y + 1, class: 'name' }, g);
  label.textContent = a.name;
  g.addEventListener('click', () => openArtist(i));
  g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openArtist(i); } });
  g._label = label;
  return g;
});

// 폰 세로 화면에선 평면도를 90° 돌려서 크게
function layoutMap() {
  const portrait = window.innerWidth < 720 && window.innerHeight > window.innerWidth;
  if (portrait) {
    map.setAttribute('viewBox', `${-(VB.y + VB.h)} ${VB.x} ${VB.h} ${VB.w}`);
    root.setAttribute('transform', 'rotate(90)');
  } else {
    map.setAttribute('viewBox', `${VB.x} ${VB.y} ${VB.w} ${VB.h}`);
    root.removeAttribute('transform');
  }
  dots.forEach((g, i) => {
    const a = ARTISTS[i];
    if (portrait) g._label.setAttribute('transform', `rotate(-90 ${a.x} ${a.y})`);
    else g._label.removeAttribute('transform');
  });
}
layoutMap();
window.addEventListener('resize', layoutMap);

// 화면에 들어오면 선 그리기 시작
if (window.IntersectionObserver) {
  new IntersectionObserver((es, ob) => {
    if (es[0].isIntersecting) {
      map.classList.add('in');
      // 등장이 끝나면 원의 지연을 지워서 마우스 반응을 즉각적으로
      setTimeout(() => dots.forEach(g => g.querySelector('.ring').style.transitionDelay = '0s'), 2600);
      ob.disconnect();
    }
  }, { threshold: 0.25 }).observe(map);
} else map.classList.add('in');

// 작가 목록
const index = document.getElementById('index');
const listBtns = ARTISTS.map((a, i) => {
  const li = document.createElement('li');
  const b = document.createElement('button');
  b.innerHTML = `<span>${String(i + 1).padStart(2, '0')}</span>`;
  b.append(a.name);
  b.addEventListener('click', () => openArtist(i));
  b.addEventListener('mouseenter', () => dots[i].classList.add('hl'));
  b.addEventListener('mouseleave', () => dots[i].classList.remove('hl'));
  li.appendChild(b); index.appendChild(li);
  return b;
});

/* ---------- 작가노트 패널 ---------- */
const sheet = document.getElementById('sheet');
const scrim = document.getElementById('scrim');
const $ = id => document.getElementById(id);
let current = -1, lastFocus = null;

function fillText(node, text, placeholder) {
  node.textContent = '';
  const empty = !text || !text.trim();
  node.classList.toggle('placeholder', empty);
  (empty ? placeholder : text).split(/\n\s*\n/).forEach(par => {
    const p = document.createElement('p');
    p.textContent = par.trim();
    node.appendChild(p);
  });
}

function openArtist(i) {
  i = (i + ARTISTS.length) % ARTISTS.length;
  const a = ARTISTS[i];
  if (current < 0) lastFocus = document.activeElement;
  current = i;
  $('s-count').textContent = `${String(i + 1).padStart(2, '0')} / ${String(ARTISTS.length).padStart(2, '0')}`;
  $('s-name').textContent = a.name;
  $('s-title').textContent = a.title || PLACEHOLDER.title;
  $('s-title').style.color = a.title ? '' : 'var(--dim)';
  $('s-medium').textContent = a.medium || PLACEHOLDER.medium;
  const fig = $('s-fig');
  fig.textContent = '';
  fig.classList.toggle('has-img', !!a.image);
  if (a.image) {
    const img = new Image(); img.src = a.image; img.alt = `${a.name} — ${a.title || '작품 이미지'}`; img.loading = 'lazy';
    fig.appendChild(img);
  } else fig.textContent = 'IMAGE';
  fillText($('s-note'), a.note, PLACEHOLDER.note);
  fillText($('s-desc'), a.desc, PLACEHOLDER.desc);
  const link = $('s-link');
  link.textContent = a.link ? `${a.link.replace(/^https?:\/\//, '')} ↗` : '';
  if (a.link) link.href = a.link; else link.removeAttribute('href');
  sheet.querySelector('.sheet-body').scrollTop = 0;

  dots.forEach((g, j) => g.classList.toggle('active', j === i));
  listBtns.forEach((b, j) => b.classList.toggle('active', j === i));
  sheet.classList.add('open'); scrim.classList.add('open');
  sheet.setAttribute('aria-hidden', 'false');
  document.body.classList.add('locked');
  history.replaceState(null, '', '#' + a.id);
  $('s-close').focus({ preventScroll: true });
}

function closeArtist() {
  if (current < 0) return;
  current = -1;
  sheet.classList.remove('open'); scrim.classList.remove('open');
  sheet.setAttribute('aria-hidden', 'true');
  document.body.classList.remove('locked');
  dots.forEach(g => g.classList.remove('active'));
  listBtns.forEach(b => b.classList.remove('active'));
  history.replaceState(null, '', location.pathname + location.search);
  if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
}

$('s-close').addEventListener('click', closeArtist);
scrim.addEventListener('click', closeArtist);
$('s-prev').addEventListener('click', () => openArtist(current - 1));
$('s-next').addEventListener('click', () => openArtist(current + 1));
window.addEventListener('keydown', e => {
  if (current < 0) return;
  if (e.key === 'Escape') closeArtist();
  if (e.key === 'ArrowLeft') openArtist(current - 1);
  if (e.key === 'ArrowRight') openArtist(current + 1);
});
// 패널 안에서 Tab 키가 밖으로 나가지 않게
sheet.addEventListener('keydown', e => {
  if (e.key !== 'Tab') return;
  const f = [...sheet.querySelectorAll('button, a[href]')];
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});

// 주소에 #작가id 가 있으면 (QR 코드 등) 평면도로 내려가서 바로 열기
function openFromHash() {
  const id = decodeURIComponent(location.hash.slice(1));
  const i = ARTISTS.findIndex(a => a.id === id);
  if (i >= 0) {
    document.getElementById('plan').scrollIntoView();
    openArtist(i);
  }
}
openFromHash();
</script>
